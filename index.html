  --dot:rgba(245,166,35,0.022); --sl:#1E1E3F;

  --sh-card:none; --sh-panel:none;
}
@media (prefers-color-scheme: light) {

}

/* ── BASE ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--b0);color:var(--c0);
  background-image:radial-gradient(circle at 22px 22px,var(--dot) 1px,transparent 0);
  background-size:44px 44px;transition:background 0.25s,color 0.25s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--b0)}
::-webkit-scrollbar-thumb{background:#F5A623;border-radius:2px}

/* ── ANIMATIONS ─────────────────────────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanLine{0%{left:-60%}100%{left:160%}}
@keyframes spin{to{transform:rotate(360deg)}}
.d1{animation:pulse 1.3s 0s infinite ease-in-out}
.d2{animation:pulse 1.3s .22s infinite ease-in-out}
.d3{animation:pulse 1.3s .44s infinite ease-in-out}
.fu{animation:fadeUp .32s ease forwards}
.spin{animation:spin 1s linear infinite}
button{cursor:pointer;font-family:inherit}button:active{transform:scale(0.97)}
textarea{resize:none;font-family:inherit}textarea:focus,input:focus{outline:none}

/* ── INTERACTION STATES ─────────────────────────────────────────────────── */
.pcard:hover{border-color:rgba(245,166,35,0.4)!important;background:rgba(245,166,35,0.06)!important}
.pill:hover{border-color:rgba(245,166,35,0.45)!important;color:#F5A623!important}
.nav-item:hover{background:rgba(128,128,200,0.06)!important}.nav-item:hover .nav-lbl{opacity:1!important}
.mod-card:hover{border-color:rgba(128,128,200,0.2)!important;transform:translateY(-1px)}
.comp-card:hover{border-color:rgba(128,128,200,0.2)!important;transform:translateY(-1px)}
.mod-card,.comp-card,.pcard{box-shadow:var(--sh-card);transition:all 0.18s}
.chat-msg{animation:fadeUp .25s ease forwards}

/* ── LIGHT MODE EXTRAS ──────────────────────────────────────────────────── */
@media (prefers-color-scheme: light) {
  .load-panel{box-shadow:var(--sh-panel)}

  ::-webkit-scrollbar-thumb{background:#D4940A}
  /* row hover subtler on light */
  .trow:hover{background:rgba(99,102,241,0.04)!important}
}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:16}}>

        <ScanBtn label="REFRESH LIVE INTEL" onClick={()=>run(PROMPTS.rivals_refresh(),"rivals_live")} isLoading={ld.rivals_live} color="#FF6B6B"/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:9,marginBottom:18}}>
        {sorted.map(c=>{
          const tc=TIER_C[c.tier]||"#F5A623",thr=THREAT_C[c.threat]||"#6B7280";
          const isSel=selC===c.id;
          return(<div key={c.id} className="comp-card" onClick={()=>setSelC(isSel?null:c.id)}
            style={{background:isSel?"var(--b1)":"var(--b2)",border:`1px solid ${isSel?thr+"55":"var(--bd)"}`,borderRadius:10,padding:"13px 14px",cursor:"pointer",transition:"all 0.18s",borderTop:`2px solid ${thr}55`}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:9}}>
              <div>
                <div style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:13,color:"var(--c0)",marginBottom:5}}>{c.n}</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  <span style={{fontSize:8,fontWeight:500,padding:"2px 7px",borderRadius:4,background:tc+"1A",color:tc,fontFamily:"'JetBrains Mono',monospace"}}>{c.tier}</span>
                  <span style={{fontSize:8,fontWeight:500,padding:"2px 7px",borderRadius:4,background:thr+"1A",color:thr,fontFamily:"'JetBrains Mono',monospace"}}>⚠ {c.threat}</span>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:"var(--c0)",fontWeight:700}}>{c.rev}</div>
                <div style={{fontSize:8,color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace"}}>{c.revFY}</div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:9}}>
              {[["FUND",c.fund],["PRICE",c.price],["STUDENTS",c.stu],["2025 AI",c.ai25.substring(0,42)+"..."]].map(([l,v])=>(<div key={l} style={{background:"var(--b3)",borderRadius:6,padding:"5px 7px"}}>
                <div style={{fontSize:7,color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.01em",marginBottom:2}}>{l}</div>
                <div style={{fontSize:10,color:"var(--c2)",lineHeight:1.3}}>{v}</div>
              </div>))}
            </div>
            {isSel&&(<div className="fu">
              <div style={{padding:"9px",background:"rgba(255,107,107,0.07)",border:"1px solid rgba(255,107,107,0.18)",borderRadius:7,marginBottom:7}}>
                <div style={{fontSize:8,color:"#FF6B6B",fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}>FULL 2025 AI MOVE</div>
                <div style={{fontSize:10.5,color:"var(--c1)",lineHeight:1.6}}>{c.ai25}</div>
              </div>
              <div style={{padding:"9px",background:"rgba(80,210,160,0.06)",border:"1px solid rgba(80,210,160,0.15)",borderRadius:7,marginBottom:7}}>
                <div style={{fontSize:8,color:"#50D2A0",fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}>IK'S GAP TO EXPLOIT</div>
                <div style={{fontSize:10.5,color:"var(--c1)",lineHeight:1.6}}>{c.gap}</div>
              </div>
              <div style={{padding:"9px",background:"rgba(245,166,35,0.06)",border:"1px solid rgba(245,166,35,0.15)",borderRadius:7,marginBottom:7}}>
                <div style={{fontSize:8,color:"#F5A623",fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}>vs IK ANALYSIS</div>
                <div style={{fontSize:10.5,color:"var(--c1)",lineHeight:1.6}}>{c.vsIK}</div>
              </div>
              {c.prof.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{c.prof.map(p=><span key={p} style={{fontSize:8,fontWeight:500,padding:"2px 7px",borderRadius:4,background:TAG[p]?.bg||"var(--bd)",color:TAG[p]?.c||"var(--c2)",fontFamily:"'JetBrains Mono',monospace"}}>{p}</span>)}</div>}
            </div>)}
            <div style={{fontSize:9,color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace",marginTop:7}}>{isSel?"▲ COLLAPSE":"▼ EXPAND ANALYSIS"}</div>
          </div>);
        })}
      </div>
      {ld.rivals_live&&<LoadBox label="Scanning competitor activity..."/>}
      {!ld.rivals_live&&cache.rivals_live&&<IBox text={cache.rivals_live.data} ts={cache.rivals_live.ts} color="#FF6B6B"/>}
    </div>);
  };

  /* ── HIRING ── */
  const rHiring=()=>{
    const cats=["ALL","SWE","AI","DATA","MGR","SYS"];
    const filtered=catF==="ALL"?PROFILES:PROFILES.filter(p=>p.t===catF);
    const sk="h_"+prof;
    return(<div>
      <p style={{color:"var(--c3)",fontSize:12.5,lineHeight:1.75,marginBottom:14}}>Select any of 18 profiles. Scans live job market — demand, skills, AI additions, salary, course opportunities.</p>
      <div style={{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap"}}>{cats.map(c=>{const a=catF===c,tc=c==="ALL"?{c:"var(--c0)"}:TAG[c]||{c:"var(--c0)"};return(<button key={c} onClick={()=>setCatF(c)} style={{padding:"5px 13px",background:a?(c==="ALL"?"rgba(245,166,35,0.12)":TAG[c]?.c+"1A"):"var(--b2)",border:`1px solid ${a?(c==="ALL"?"#F5A623":TAG[c]?.c):"var(--bd)"}`,borderRadius:20,fontSize:10,fontWeight:600,color:a?(c==="ALL"?"#F5A623":TAG[c]?.c):"var(--c4)",transition:"all 0.15s",fontFamily:"'JetBrains Mono',monospace"}}>{c}</button>);})}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(136px,1fr))",gap:7,marginBottom:16}}>
        {filtered.map(p=>{const tc=TAG[p.t];const sel=prof===p.id;const hc=!!cache["h_"+p.id];
          return(<button key={p.id} onClick={()=>setProf(p.id)} className="pcard"
            style={{background:sel?"rgba(245,166,35,0.08)":"var(--b2)",border:`1px solid ${sel?"#F5A623":"var(--bd)"}`,borderRadius:8,padding:"9px 11px",textAlign:"left",transition:"all 0.15s",position:"relative"}}>
            {hc&&<div style={{position:"absolute",top:5,right:6,width:6,height:6,borderRadius:"50%",background:"#50D2A0"}}/>}
            <div style={{fontSize:10.5,fontWeight:600,color:sel?"#F5A623":"var(--c0)",marginBottom:6,lineHeight:1.3,paddingRight:8}}>{p.l}</div>
            <span style={{fontSize:8,fontWeight:500,padding:"2px 6px",borderRadius:4,background:tc.bg,color:tc.c,fontFamily:"'JetBrains Mono',monospace"}}>{p.t}</span>
          </button>);
        })}
      </div>
      {prof?(
        <>
          <div style={{padding:"9px 13px",background:"rgba(78,205,196,0.07)",border:"1px solid rgba(78,205,196,0.22)",borderRadius:8,marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{color:"#4ECDC4",fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.015em"}}>SELECTED → {PROFILES.find(p=>p.id===prof)?.l}</span>
            {cache[sk]&&<span style={{fontSize:9,color:"#50D2A0",fontFamily:"'JetBrains Mono',monospace"}}>cached {timeSince(cache[sk].ts)}</span>}
          </div>
          <ScanBtn label={`SCAN: ${(PROFILES.find(p=>p.id===prof)?.l||"").toUpperCase()}`}
            onClick={()=>{const pl=PROFILES.find(p=>p.id===prof)?.l;run(PROMPTS.hiring(pl),"h_"+prof);}}
            isLoading={ld["h_"+prof]} color="#4ECDC4"/>
          {ld["h_"+prof]&&<LoadBox label={`Scanning job market for ${PROFILES.find(p=>p.id===prof)?.l}...`}/>}
          {!ld["h_"+prof]&&cache[sk]&&<IBox text={cache[sk].data} ts={cache[sk].ts} color="#4ECDC4"/>}
        </>
      ):<EHint msg="↑  Select a profile above to scan its job market intelligence"/>}
    </div>);
  };

  /* ── SIGNALS ── */
  const rSignals=()=>(<div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>{[["S","Signals"],["H","Hiring"],["I","Intelligence"],["F","Funding"],["T","Trends"]].map(([l,w])=>(<div key={l} style={{background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:8,padding:"6px 13px",display:"flex",alignItems:"center",gap:7}}><span style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:17,color:"#F5A623"}}>{l}</span><span style={{fontSize:11,color:"var(--c2)"}}>{w}</span></div>))}</div>
    <p style={{color:"var(--c3)",fontSize:12.5,lineHeight:1.75,marginBottom:16}}>Daily intelligence briefing. Scans live AI industry news, job role trends, EdTech moves, and hiring signals.</p>
    <ScanBtn label="RUN MORNING BRIEFING" onClick={()=>run(PROMPTS.signals(),"signals")} isLoading={ld.signals}/>
    {ld.signals&&<LoadBox label="Scanning live intelligence sources..."/>}
    {!ld.signals&&cache.signals&&<IBox text={cache.signals.data} ts={cache.signals.ts}/>}
    {!ld.signals&&!cache.signals&&<EHint msg="↑  Hit 'Run Morning Briefing' to get today's intelligence"/>}
  </div>);

  /* ── ENGINE ── */
  const rEngine=()=>(<div>
    <p style={{color:"var(--c3)",fontSize:12.5,lineHeight:1.75,marginBottom:16}}>Enter any course idea. Scores across 5 dimensions, gives a launch verdict, positioning angle, and first move.</p>
    <div style={{marginBottom:13}}>
      <label style={{display:"block",fontSize:10,color:"#50D2A0",fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:"0.02em",fontFamily:"'JetBrains Mono',monospace"}}>Course Idea</label>
      <textarea value={idea} onChange={e=>setIdea(e.target.value)} rows={3} placeholder="e.g.  AI Product Manager Bootcamp,  Agentic AI for TPMs..."
        onFocus={e=>e.target.style.borderColor="rgba(80,210,160,0.5)"} onBlur={e=>e.target.style.borderColor="var(--bd)"}
        style={{width:"100%",background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:8,padding:"11px 13px",color:"var(--c0)",fontSize:12.5,lineHeight:1.6,transition:"border-color 0.2s"}}/>
    </div>
    <div style={{marginBottom:16}}>
      <div style={{fontSize:9,color:"var(--c5)",marginBottom:6,fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.02em"}}>QUICK IDEAS →</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{QUICK_IDEAS.map(q=><button key={q} onClick={()=>setIdea(q)} className="pill" style={{padding:"4px 10px",background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:20,fontSize:10,color:"var(--c3)",transition:"all 0.15s"}}>{q}</button>)}</div>
    </div>
    <ScanBtn label="SCORE THIS OPPORTUNITY" onClick={()=>{if(idea.trim())run(PROMPTS.engine(idea.trim()),"engine_latest");}} isLoading={ld.engine_latest} disabled={!idea.trim()} color="#50D2A0"/>
    {ld.engine_latest&&<LoadBox label="Scoring market opportunity..."/>}
    {!ld.engine_latest&&cache.engine_latest&&<ScoreCard text={cache.engine_latest.data} ts={cache.engine_latest.ts}/>}
    {!ld.engine_latest&&!cache.engine_latest&&<EHint msg="↑  Enter a course idea and hit 'Score This Opportunity'"/>}
  </div>);

  /* ── CATEGORY MGR ── */
  const SUGG=["Which competitor threatens our ML Engineer course most?","What course should IK launch in the next 90 days?","How do we counter Scaler's IIT partnership?","Score IK's competitive position in Agentic AI","Revenue potential of an AI Security Engineer course?","Which IK profiles have the least competition?","Analyze upGrad's AI pivot and its impact on IK","What's leaving money on the table for IK right now?","Where should IK expand beyond MAANG prep?","How do we defend against Coursera pricing pressure?"];
  const rCatMgr=()=>(<div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 178px)"}}>
    <p style={{color:"var(--c3)",fontSize:12.5,lineHeight:1.75,marginBottom:12,flexShrink:0}}>Pre-loaded with IK's full course portfolio, 16 competitors, June 2026 market data. Your senior Category Strategist. Enter to send.</p>
    {chatH.length===0&&(<div style={{marginBottom:14,flexShrink:0}}>
      <div style={{fontSize:9,color:"var(--c5)",marginBottom:6,fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.02em"}}>SUGGESTED QUESTIONS →</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{SUGG.map(q=><button key={q} onClick={()=>chat(q)} className="pill" style={{padding:"4px 10px",background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:20,fontSize:10,color:"var(--c3)",transition:"all 0.15s",textAlign:"left"}}>{q}</button>)}</div>
    </div>)}
    <div ref={chatRef} style={{flex:1,overflowY:"auto",background:"var(--b1)",borderRadius:10,border:"1px solid var(--bd)",padding:"14px",marginBottom:10,minHeight:160}}>
      {chatH.length===0?(<div style={{textAlign:"center",padding:"36px 20px",color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>
        ◧ Virtual Category Manager ready<br/><span style={{fontSize:9,marginTop:7,display:"block"}}>Context: 13 courses · 16 competitors · June 2026 market data</span>
      </div>):(
        chatH.map((m,i)=>(<div key={i} className="chat-msg" style={{marginBottom:14,display:"flex",gap:9,flexDirection:m.role==="user"?"row-reverse":"row"}}>
          <div style={{width:26,height:26,borderRadius:"50%",background:m.role==="user"?"rgba(245,166,35,0.18)":"rgba(168,85,247,0.18)",border:`1px solid ${m.role==="user"?"rgba(245,166,35,0.4)":"rgba(168,85,247,0.4)"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:10,color:m.role==="user"?"#F5A623":"#A855F7",fontFamily:"'Inter',sans-serif",fontWeight:700}}>{m.role==="user"?"U":"AI"}</div>
          <div style={{background:m.role==="user"?"rgba(245,166,35,0.06)":"rgba(168,85,247,0.06)",border:`1px solid ${m.role==="user"?"rgba(245,166,35,0.14)":"rgba(168,85,247,0.12)"}`,borderRadius:10,padding:"11px 13px",maxWidth:"85%"}}>
            <pre style={{fontFamily:"'Inter',sans-serif",fontSize:12.5,lineHeight:1.78,color:"var(--c0)",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{m.content}</pre>
          </div>
        </div>))
      )}
      {ld.catmgr&&(<div style={{display:"flex",gap:6,padding:"8px"}}><div className="d1" style={{width:7,height:7,borderRadius:"50%",background:"#A855F7"}}/><div className="d2" style={{width:7,height:7,borderRadius:"50%",background:"#A855F7"}}/><div className="d3" style={{width:7,height:7,borderRadius:"50%",background:"#A855F7"}}/></div>)}
    </div>
    <div style={{display:"flex",gap:9,flexShrink:0}}>
      <textarea value={chatIn} onChange={e=>setChatIn(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey&&chatIn.trim()){e.preventDefault();chat(chatIn.trim());}}}
        placeholder="Ask the Category Manager... (Enter to send, Shift+Enter for newline)" rows={2}
        onFocus={e=>e.target.style.borderColor="rgba(168,85,247,0.5)"} onBlur={e=>e.target.style.borderColor="var(--bd)"}
        style={{flex:1,background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:8,padding:"11px 13px",color:"var(--c0)",fontSize:12.5,lineHeight:1.5,transition:"border-color 0.2s"}}/>
      <button onClick={()=>{if(chatIn.trim())chat(chatIn.trim());}} disabled={!chatIn.trim()||ld.catmgr}
        style={{padding:"11px 16px",background:chatIn.trim()&&!ld.catmgr?"rgba(168,85,247,0.12)":"var(--b3)",border:`1px solid ${chatIn.trim()&&!ld.catmgr?"#A855F7":"var(--bdd)"}`,borderRadius:8,color:chatIn.trim()&&!ld.catmgr?"#A855F7":"var(--c5)",fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:11,letterSpacing:"0.015em",transition:"all 0.18s",alignSelf:"stretch"}}>SEND</button>
      {chatH.length>0&&<button onClick={()=>{setChatH([]);LS.set("chat_history",[]);}} style={{padding:"11px 13px",background:"var(--b2)",border:"1px solid var(--bd)",borderRadius:8,color:"var(--c5)",fontSize:10,fontFamily:"'JetBrains Mono',monospace",alignSelf:"stretch",transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.color="#FF6B6B"} onMouseLeave={e=>e.currentTarget.style.color="var(--c5)"}>CLEAR</button>}
    </div>
  </div>);

  /* ── LAYOUT ── */
  const cm=MOD[tab];
  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
    {/* HEADER */}
    <div style={{height:50,flexShrink:0,padding:"0 20px",borderBottom:"1px solid var(--bdh)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bh)",zIndex:200,backdropFilter:"blur(12px)",boxShadow:"0 1px 0 0 rgba(245,166,35,0.07)"}}>
      <div style={{display:"flex",alignItems:"center",gap:11}}>
        <div style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:22,color:"#F5A623",letterSpacing:"-0.02em",lineHeight:1}}>SHIFT</div>
        <div style={{width:1,height:22,background:"var(--bdh)"}}/>
        <div>
          <div style={{fontSize:8,color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.02em"}}>SKILLS · HIRING · INTELLIGENCE · FUNDING · TRENDS</div>
          <div style={{fontSize:8,color:"var(--c7)",fontFamily:"'JetBrains Mono',monospace"}}>Interview Kickstart · Category Intelligence OS v2</div>
        </div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#F5A623",letterSpacing:"0.01em"}}>{tsStr}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"var(--c5)",marginTop:1}}>{dtStr}</div>
      </div>
    </div>
    {/* BODY */}
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* SIDEBAR */}
      <div style={{width:182,flexShrink:0,background:"var(--b1)",borderRight:"1px solid var(--bdh)",display:"flex",flexDirection:"column",overflowY:"auto"}}>
        <div style={{flex:1,padding:"9px 0"}}>
          {Object.entries(MOD).map(([key,mod])=>{const active=tab===key;return(<button key={key} onClick={()=>setTab(key)} className="nav-item" style={{width:"100%",padding:"9px 14px",background:active?mod.c+"14":"transparent",border:"none",borderLeft:`3px solid ${active?mod.c:"transparent"}`,textAlign:"left",transition:"all 0.15s",display:"block"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:13,opacity:active?1:0.4,color:mod.c}}>{mod.icon}</span>
              <div>
                <div className="nav-lbl" style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:10,color:active?mod.c:"var(--cn)",letterSpacing:"0.015em",opacity:active?1:0.8,transition:"opacity 0.15s"}}>{mod.label}</div>
                <div style={{fontSize:7,color:active?"var(--c4)":"var(--cns)",fontFamily:"'JetBrains Mono',monospace"}}>{mod.sub}</div>
              </div>
            </div>
          </button>);})}
        </div>
        <div style={{padding:"11px 14px",borderTop:"1px solid var(--bdh)"}}>
          <div style={{fontSize:8,color:"var(--c6)",fontFamily:"'JetBrains Mono',monospace",marginBottom:2}}>TOTAL SCANS</div>
          <div style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:18,color:"#F5A623"}}>{scanCount}</div>
          <div style={{fontSize:7,color:"var(--c6)",fontFamily:"'JetBrains Mono',monospace",marginTop:4}}>v2.0 · SHIFT by IK</div>
        </div>
      </div>
      {/* MAIN */}
      <div style={{flex:1,overflowY:"auto",padding:tab==="catmgr"?"22px 26px 0":"22px 26px 56px"}}>
        <div style={{maxWidth:tab==="market"||tab==="rivals"?1000:840,margin:"0 auto"}}>
          {tab!=="home"&&(<div style={{marginBottom:18}}>
            <h1 style={{fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:19,color:cm?.c||"var(--c0)",marginBottom:2,letterSpacing:"-0.01em"}}>{cm?.label}</h1>
            <div style={{fontSize:8,color:"var(--c5)",fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.02em"}}>{cm?.sub}</div>
          </div>)}
          {tab==="home"    &&rHome()}
          {tab==="market"  &&rMarket()}
          {tab==="rivals"  &&rRivals()}
          {tab==="hiring"  &&rHiring()}
          {tab==="signals" &&rSignals()}
          {tab==="engine"  &&rEngine()}
          {tab==="catmgr"  &&rCatMgr()}
        </div>
      </div>
    </div>
  </div>);
}
ReactDOM.render(<SHIFT/>,document.getElementById("root"));
</script></body></html>
